services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowqueue
      POSTGRES_PASSWORD: flowqueue
      POSTGRES_DB: flowqueue
    volumes:
      - flowqueue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowqueue -d flowqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - flowqueue_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://flowqueue:flowqueue@postgres:5432/flowqueue
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    working_dir: /app
    command: python worker/main.py
    environment:
      DATABASE_URL: postgresql+psycopg://flowqueue:flowqueue@postgres:5432/flowqueue
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  flowqueue_postgres_data:
  flowqueue_redis_data: